schema:
  - "*.graphql"

exec:
  layout: split-packages
  filename: generated.go
  package: splitpackages

model:
  filename: model/models_gen.go
  package: model

resolver:
  filename: resolver.go
  package: splitpackages
  type: Resolver

autobind:
  - "github.com/99designs/gqlgen/codegen/testserver/splitpackages/model"

models:
  HybridInput:
    fields:
      resolved:
        resolver: true
  HybridNested:
    fields:
      resolved:
        resolver: true

directives:
  codegenOnly:
    skip_runtime: true
